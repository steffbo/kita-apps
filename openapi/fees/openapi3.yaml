      description: Create a relationship between a parent and a child
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkParentRequest"
        description: Parent link data
        required: true
      responses:
        "204":
          description: Parent linked
        "400":
          description: Invalid request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Child or parent not found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Link parent to child
      tags:
        - Children
  "/children/{id}/parents/{parentId}":
    delete:
      description: Remove the relationship between a parent and a child
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Parent ID (UUID)
          in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Parent unlinked
        "400":
          description: Invalid ID
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Unlink parent from child
      tags:
        - Children
  "/children/{id}/timeline":
    get:
      description: Returns monthly fee coverage showing which months are paid/unpaid
        based on transaction dates
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Year (defaults to current year)
          in: query
          name: year
          schema:
            type: integer
      responses:
        "200":
          description: Monthly coverage timeline
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/handler.FeeCoverageResponse"
                type: array
        "400":
          description: Invalid child ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Child not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get child fee timeline
      tags:
        - Children
  /children/import/execute:
    post:
      description: Execute the import with the validated and confirmed data
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/service.ExecuteRequest"
        description: Import data
        required: true
      responses:
