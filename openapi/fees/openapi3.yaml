              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Preview child import with mapping
      tags:
        - Children Import
  /children/next-member-number:
    get:
      description: Returns the next available numeric member number for a new child
      responses:
        "200":
          description: Next member number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextMemberNumberResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get next available member number
      tags:
        - Children
  /einstufungen:
    get:
      description: Returns Einstufungen for a year with pagination
      parameters:
        - description: Year
          in: query
          name: year
          required: true
          schema:
            type: integer
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Items per page
          in: query
          name: perPage
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinstufungList"
      security:
        - BearerAuth: []
      summary: List fee classifications
      tags:
        - Einstufungen
    post:
      description: Creates a new Einstufung by calculating fees from income proofs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEinstufungRequest"
        description: Einstufung data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Einstufung"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create a fee classification
