openapi: 3.0.0
info:
  contact:
    name: Kita Knirpsenstadt
  description: API für Beitragsverwaltung der Kita Knirpsenstadt
  title: Kita Knirpsenstadt Fees API
  version: 1.0.0
paths:
  /auth/change-password:
    post:
      description: Change the password for the currently authenticated user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        description: Current and new password
        required: true
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid request or current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Change own password
      tags:
        - Auth
  /auth/login:
    post:
      description: Authenticate a user with email and password, returns JWT tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        description: Login credentials
        required: true
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      summary: User login
      tags:
        - Auth
  /auth/logout:
    post:
      description: Invalidate the refresh token, ending the session
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        description: Refresh token to revoke
      responses:
        "204":
          description: Logged out successfully
      security:
        - BearerAuth: []
      summary: Logout
      tags:
        - Auth
  /auth/me:
    get:
      description: Returns information about the currently authenticated user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get current user info
      tags:
        - Auth
  /auth/refresh:
    post:
      description: Exchange a refresh token for a new access token and refresh token pair
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        description: Refresh token
        required: true
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or revoked refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      summary: Refresh access token
      tags:
        - Auth
  /childcare-fee/calculate:
    get:
      description: Calculate the monthly childcare fee based on income, child age, and
        care hours
      parameters:
        - description: Child age type
          in: query
          name: childAgeType
          schema:
            type: string
            enum:
              - krippe
              - kindergarten
            default: krippe
        - description: Annual net household income
          in: query
          name: income
          required: true
          schema:
            type: number
        - description: Number of siblings
          in: query
          name: siblingsCount
          schema:
            type: integer
            default: 1
        - description: Weekly care hours
          in: query
          name: careHours
          schema:
            type: integer
            enum:
              - 30
              - 35
              - 40
              - 45
              - 50
              - 55
            default: 30
        - description: Apply highest rate
          in: query
          name: highestRate
          schema:
            type: boolean
            default: false
        - description: Foster family (uses average rate)
          in: query
          name: fosterFamily
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Calculated fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildcareFeeResult"
        "400":
          description: Invalid income value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Calculate childcare fee
      tags:
        - Fees
  /children:
    get:
      description: Get a paginated list of children with optional filters
      parameters:
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Items per page
          in: query
          name: perPage
          schema:
            type: integer
            default: 20
        - description: Filter by active status
          in: query
          name: active
          schema:
            type: boolean
        - description: Filter for children under 3
          in: query
          name: u3Only
          schema:
            type: boolean
        - description: Filter for children with warnings
          in: query
          name: hasWarnings
          schema:
            type: boolean
        - description: Filter for children with open fees
          in: query
          name: hasOpenFees
          schema:
            type: boolean
        - description: Search by name or member number
          in: query
          name: search
          schema:
            type: string
        - description: Sort field (name, birthDate, entryDate)
          in: query
          name: sortBy
          schema:
            type: string
            default: name
        - description: Sort direction (asc, desc)
          in: query
          name: sortDir
          schema:
            type: string
            default: asc
      responses:
        "200":
          description: Paginated list of children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: List all children
      tags:
        - Children
    post:
      description: Register a new child in the system
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildRequest"
        description: Child data
        required: true
      responses:
        "201":
          description: Child created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Member number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create new child
      tags:
        - Children
  "/children/{id}":
    delete:
      description: Permanently delete a child record
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Child deleted
        "400":
          description: Invalid child ID
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Child not found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Delete child
      tags:
        - Children
    get:
      description: Retrieve detailed information about a specific child
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Child found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          description: Invalid child ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Child not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get child by ID
      tags:
        - Children
    put:
      description: Update child information
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChildRequest"
        description: Updated child data
        required: true
      responses:
        "200":
          description: Child updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Child not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Update child
      tags:
        - Children
  "/children/{id}/care-hours-history":
    get:
      description: Returns all recorded care hours periods for a child
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Care hours history
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CareHoursHistoryEntry"
                type: array
        "400":
          description: Invalid child ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Child not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get child care hours history
      tags:
        - Children
    post:
      description: Adds a care hours history entry effective from the given date
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCareHoursHistoryRequest"
        description: Care hours history data
        required: true
      responses:
        "204":
          description: Care hours history saved
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Child not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Add child care hours history entry
      tags:
        - Children
  "/children/{id}/ledger":
    get:
      description: Retrieve the payment ledger showing all fees and payments for a child
      parameters:
        - description: Child ID (UUID)
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Filter by year
          in: query
          name: year
          schema:
            type: integer
      responses:
        "200":
          description: Payment ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildLedger"
        "400":
          description: Invalid child ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Child not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get child payment ledger
      tags:
        - Children
  "/children/{id}/legal-hours-history":
