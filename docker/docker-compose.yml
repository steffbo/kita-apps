# Local development database.
# Start with: docker compose up db -d

services:
  db:
    image: postgres:16-alpine
    container_name: kita-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kita
      POSTGRES_USER: kita
      POSTGRES_PASSWORD: kita_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kita"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
