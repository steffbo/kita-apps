<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--foreground,#18181b)}

.side{display:flex;flex-direction:column;width:232px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);padding:12px 10px;overflow-y:auto}

.ni svg{color:var(--muted)}
.ni:hover{background:var(--subtle)}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:4px;height:56px;padding:0 8px 0 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.top.back{padding-left:4px}
.top h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border:0;border-radius:8px;background:none;display:grid;place-items:center;flex-shrink:0}
.ib:hover{background:var(--subtle)}
.ib.pri{background:var(--ac);color:var(--ac-fg)}
.avb{width:30px;height:30px;border-radius:50%;background:var(--subtle);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:16px 16px 24px}
.inner{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabs{display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 2px 10px;flex-shrink:0}
.tab{flex:0 0 auto;min-width:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;font-size:11px;font-weight:500;color:var(--muted);position:relative;white-space:nowrap}
.tab .ico{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.tab.on{color:var(--ac-text)}

.dotc{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;border:2px solid var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;min-height:24px;font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;min-height:60px}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--subtle)}
.row>svg:last-child{color:var(--muted)}
.rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}

.av{width:36px;height:36px;border-radius:50%;background:var(--subtle);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);flex-shrink:0}
.av.sm{width:28px;height:28px;font-size:11px}
.ri{width:36px;height:36px;border-radius:10px;background:var(--subtle);display:grid;place-items:center;color:var(--muted);flex-shrink:0}

.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--subtle);color:var(--muted);border:1px solid transparent;font-variant-numeric:tabular-nums}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.badge.acc{background:var(--ac-soft);color:var(--ac-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:500;font-size:14px;white-space:nowrap;background:none}
.btn.pri{background:var(--ac);color:var(--ac-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);border-color:var(--line)}
.btn.sec:hover{background:var(--subtle)}
.btn.ghost{color:var(--ac-text);padding:0 10px}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.toolbar{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip span{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ac-soft);color:var(--ac-text);border-color:transparent}
.chip.on span{color:var(--ac-text);opacity:.75}
.inp{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}
.inp:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.inp input{flex:1;min-width:0;border:0;outline:0;background:none;height:100%;font-size:16px}
.inp input::placeholder{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:500}
.field input,.field select,.field textarea{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px;outline:0;width:100%}
.field textarea{height:96px;padding:10px 12px;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.grid4,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:6px;border-radius:3px;background:var(--subtle);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.cols2{display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.rtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:-4px}
.rtabs button{border:0;background:none;height:40px;padding:0 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.rtabs button.on{color:var(--fg);border-bottom-color:var(--ac)}
.hrow{display:flex;flex-wrap:wrap;gap:6px}
.dl .r{display:flex;justify-content:space-between;gap:16px;padding:11px 14px;border-bottom:1px solid var(--line)}
.dl .r:last-child{border-bottom:0}
.dl .k{color:var(--muted);flex-shrink:0}
.dl .v{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.note{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:12px;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:500}
.note span{flex:1}
.note .btn{color:var(--fg)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 16px;color:var(--muted);text-align:center}
.empty .ri{width:44px;height:44px;border-radius:12px}
.monthsw{display:flex;align-items:center;justify-content:space-between;padding:4px;font-weight:600}
.notecard{padding:14px}
.notecard p{margin:0 0 6px}
.mail{padding:14px;font-size:13px;line-height:1.55;white-space:pre-line}
.cell{display:flex;align-items:center;gap:10px;font-weight:500}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.t td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:hover{background:var(--subtle);cursor:pointer}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.t .mut{color:var(--muted);font-variant-numeric:tabular-nums}
.rad{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.rad.on{background:var(--ac);border-color:var(--ac);color:var(--ac-fg)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--ac);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sg{display:flex;background:var(--subtle);border-radius:10px;padding:3px;gap:3px}
.sg button{flex:1;height:36px;border:0;border-radius:8px;background:none;font-weight:500;color:var(--muted)}
.sg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .15s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:90%;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex-shrink:0}
.sh-head{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 16px}
.sh-head h2{flex:1;margin:0;font-size:17px;font-weight:600}
.sh-body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.sh-body>*{flex-shrink:0}
.sh-foot{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1;height:44px}
.searchov{position:absolute;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;animation:fade .12s}
.sov-head{display:flex;gap:4px;align-items:center;padding:6px 6px 6px 12px;min-height:56px;border-bottom:1px solid var(--line);background:var(--surface)}
.sov-head .inp{flex:1;height:40px}
.sov-body{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.sov-body .row{min-height:52px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;z-index:30;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .15s}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}}
body.shot *{animation:none!important}

@container app (max-width:639.98px){.d{display:none!important}}
@container app (min-width:640px){
 .m{display:none!important}
 .top{height:60px;padding:0 16px 0 24px}
 .top.back{padding-left:12px}
 .main{padding:24px}
 .grid4{grid-template-columns:repeat(4,1fr)}
 .cols2{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:16px}
 .toolbar{flex-direction:row;align-items:center}

 .chips{margin:0;padding:0}
 .sheet{left:50%;right:auto;top:50%;bottom:auto;width:480px;border-radius:14px;border:1px solid var(--line);max-height:85%;transform:translate(-50%,-50%);animation:pop .18s ease-out;box-shadow:0 24px 48px rgba(0,0,0,.25)}

}

 body{padding:0;display:flex;flex-direction:column;height:100dvh}

}

// Ratenplan: Zahlungen werden der ältesten offenen Rate zugerechnet (FIFO), Überzahlung läuft in die nächste Rate.
function regular(p){
 const n=Math.ceil(p.total/p.rate-1e-9),out=[];
 for(let i=0;i<n;i++)out.push({due:addM(p.first,i*p.interval),amt:i<n-1?p.rate:Math.round((p.total-p.rate*(n-1))*100)/100});
 return out;
}
// Schlussrate: bezahlte Raten bleiben stehen, alles noch Offene (auch Überfälliges) wird an diesem Tag in einer Rate fällig.
function withFinal(p,date){
 let pool=p.payments.reduce((s,x)=>s+x.amount,0);
 const keep=regular(p).filter(r=>{if(pool>=r.amt-1e-9){pool-=r.amt;return true}return false}),kept=keep.reduce((s,r)=>s+r.amt,0);
 return [...keep,{due:date,amt:Math.round((p.total-kept)*100)/100,final:true}];
}
function schedule(p){
 const raw=p.final?withFinal(p,p.final):regular(p);let pool=p.payments.reduce((s,x)=>s+x.amount,0);
 return raw.map((r,i)=>{const cov=Math.min(pool,r.amt);pool=Math.round((pool-cov)*100)/100;
  const st=cov>=r.amt-1e-9?'paid':r.due<S.today?'overdue':cov>0?'partial':'open';return {...r,nr:i+1,cov,st}});
}
function summary(p){
 const sch=schedule(p), paid=Math.min(p.payments.reduce((s,x)=>s+x.amount,0),p.total), rest=Math.round((p.total-paid)*100)/100;

 const next=sch.find(r=>r.st!=='paid'&&r.due>=S.today);
 const state=p.status==='closed'?'closed':rest<=0?'done':overdue.length?'overdue':'active';
 return {sch,paid,rest,overdue,overdueAmt,next,state,n:sch.length,nPaid:sch.filter(r=>r.st==='paid').length};
}

 const debtor=p.kind==='hh'?dl([['Haushalt',`<a href="#" data-a="toast" data-v="Öffnet die Haushaltsseite" style="color:var(--ac-text)">${esc(p.name)}</a>`],['Kinder',hh(p.household).kids]]):dl([['Name',esc(p.name)],['Anschrift',p.address?esc(p.address).replace(/\n/g,'<br>'):'<span class="mut">—</span>'],['Art','Externer Schuldner (kein Haushalt)']]);
 return `${s.state==='overdue'?`<div class="note bad">${ic('alert',18)}<span>${s.overdue.length} ${s.overdue.length===1?'Rate':'Raten'} überfällig · ${eur(s.overdueAmt)}</span><button class="btn sm sec" data-a="remind" data-v="${p.id}">${nextStage(p)}</button></div>`:''}
 <div class="card stat"><div class="l">Restschuld</div><div class="v">${eur(s.rest)} <small>von ${eur(p.total)}</small></div><div class="bar"><i style="width:${pct}%"></i></div><div class="prog"><span>${eur(s.paid)} bezahlt · ${s.nPaid}/${s.n} Raten</span>${stBadge(s.state)}</div></div>
 <div class="cols2"><div class="stack">
 <section>${sec('Vereinbarung',s.rest>0&&p.status==='active'?(p.final?`<button class="btn sm sec" data-a="unfinal">Schlussrate aufheben</button>`:`<button class="btn sm sec" data-a="sheet" data-v="final">${ic('cal',14)}Schlussrate</button>`):'')}<div class="card dl">${dl([['Ratenhöhe',eur(p.rate)],['Intervall',intL(p.interval)],['Erste Rate',fd(p.first)],[p.final?'Schlussrate':'Letzte Rate',p.final?`${fd(p.final)} · ${eur(s.sch[s.n-1].amt)}`:fd(s.sch[s.n-1].due)],['Bezug',p.ref?esc(p.ref):'<span class="mut">—</span>'],['IBAN für Abgleich',p.iban||'<span class="mut">—</span>']])}</div></section>
 <section>${sec('Vertrag')}${p.contract?`<div class="card">${contractCard(p.contract,'plan')}</div>`:`<div class="note" style="margin-bottom:8px">${ic('alert',18)}<span>Noch kein unterschriebener Vertrag hinterlegt.</span></div>${contractCard(null,'plan')}`}</section>
 <section>${sec('Schuldner')}<div class="card dl">${debtor}</div></section>
 <section>${sec('E-Mail für Erinnerungen',`<button class="btn sm sec" data-a="editplan">${ic('pencil',14)}Ändern</button>`)}<div class="card" style="padding:12px 14px">${p.emails.length?`<div class="tags">${p.emails.map(e=>`<span class="tag" style="padding-right:10px">${ic('mail',14)}${esc(e)}</span>`).join('')}</div>`:`<div class="note" style="margin:0">${ic('alert',18)}<span>Keine Adresse – Erinnerungen nur per Brief möglich.</span></div>`}</div></section>
 ${p.note?`<section>${sec('Notiz')}<div class="card notecard"><p>${esc(p.note)}</p></div></section>`:''}
 </div><div class="stack">
 <section>${sec('Ratenplan')}<div class="card">${s.sch.map(r=>`<div class="row" style="min-height:52px"><span class="ri ${r.st==='paid'?'ok':r.st==='overdue'?'bad':r.st==='partial'?'warn':''}">${r.st==='paid'?ic('check',16):`<b style="font-size:13px">${r.nr}</b>`}</span><span class="rm"><span class="rt">${r.final?'Schlussrate':'Rate '+r.nr} · ${eur(r.amt)}</span><span class="rs">fällig ${fd(r.due)}${r.st==='partial'||(r.st==='overdue'&&r.cov)?` · ${eur(r.cov)} bezahlt`:''}</span></span>${rBadge(r.st)}</div>`).join('')}</div></section>
 <section>${sec('Zahlungen',`<button class="btn sm sec" data-a="addpay" data-v="${p.id}">${ic('plus',14)}Zahlung</button>`)}<div class="card">${p.payments.length?[...p.payments].reverse().map(x=>`<div class="row" style="min-height:52px"><span class="ri ${x.src==='bank'?'':'acc'}">${ic(x.src==='bank'?'bank':'cash',16)}</span><span class="rm"><span class="rt">${fd(x.date)}</span><span class="rs">${x.src==='bank'?'Bank · ':''}${esc(x.text)}</span></span><span class="amt pos">+${eur(x.amount)}</span></div>`).join(''):empty('bank','Noch keine Zahlung')}</div></section>
 <section>${sec('Erinnerungsverlauf')}<div class="card">${p.reminders.length?p.reminders.map(r=>`<div class="row" style="min-height:52px"><span class="ri">${ic('mail',16)}</span><span class="rm"><span class="rt">${r.stage}${r.fee?` + Mahngebühr ${eur(r.fee)}`:''}</span><span class="rs">${fd(r.date)} · ${esc(r.to)} · Frist ${fd(r.deadline)}</span></span></div>`).join(''):empty('mail','Noch nichts versendet')}</div></section>
 <button class="btn ghost" style="align-self:flex-start;color:var(--bad)" data-a="sheet" data-v="close">Ratenzahlung beenden …</button>
 </div></div>`;
}
function pReminders(){
 const r=remCases();
 if(S.remFilter==='sent')return remChips()+`<div class="card">${DB.sent.map(([n,s,d])=>`<div class="row"><span class="ri">${ic('mail',18)}</span><span class="rm"><span class="rt">${esc(n)}</span><span class="rs">${s} · ${d}</span></span></div>`).join('')}</div>`;
 const rows=[...r.map(({p,s})=>`<button class="row" data-a="remind" data-v="${p.id}"><span class="ri acc">${ic('coins',18)}</span><span class="rm"><span class="rt">${esc(p.name)}</span><span class="rs">Ratenzahlung · ${s.overdue.length} ${s.overdue.length===1?'Rate':'Raten'} überfällig${p.emails.length?'':' · <span style="color:var(--bad)">keine E-Mail</span>'}</span></span><span class="re"><span class="amt">${eur(s.overdueAmt)}</span><span class="badge ${p.reminders.length?'bad':'warn'}">${nextStage(p)}</span></span></button>`),
  ...DB.feeCases.map(c=>`<button class="row" data-a="toast" data-v="Beitragsfall: Ablauf wie bisher"><span class="ri">${ic('receipt',18)}</span><span class="rm"><span class="rt">${c.name}</span><span class="rs">Beiträge · ${c.sub}</span></span><span class="re"><span class="amt">${eur(c.open)}</span><span class="badge ${c.stage==='Mahnung'?'bad':'warn'}">${c.stage}</span></span></button>`)];
 return remChips()+`<div class="card">${rows.join('')}</div><p class="hint">Ratenzahlungen erscheinen hier, sobald eine Rate nach ihrem Fälligkeitstag nicht vollständig bezahlt ist.</p>`;
}
const remChips=()=>`<div class="chips">${chip('rf','due','Fällig',remCount(),S.remFilter==='due')}${chip('rf','sent','Versandverlauf',null,S.remFilter==='sent')}</div>`;
function page(){
 if(!MOCKED.includes(S.page))return `<div class="card">${empty('info','Diese Seite ist nicht Teil des Entwurfs',`<button class="btn sec sm" data-a="go" data-v="raten">Zu Ratenzahlungen</button>`)}</div>`;
 return {dashboard:pDashboard,tasks:pTasks,raten:pRaten,plan:pPlan,erinnerungen:pReminders}[S.page]();
}

// ── Sheets ──
function sheetWrap(title,body,foot){return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog"><div class="grab"></div><div class="sh-head"><h2>${title}</h2><button class="ib" data-a="close" aria-label="Schließen">${ic('x')}</button></div><div class="sh-body">${body}</div>${foot?`<div class="sh-foot">${foot}</div>`:''}</div>`}
const txCard=t=>`<div class="card txcard"><span class="k">Zahler</span><span class="v">${esc(t.payer)}</span><span class="k">Betrag</span><span class="v amt pos">+${eur(t.amount)}</span><span class="k">Datum</span><span class="v">${fd(t.date)}</span><span class="k">Zweck</span><span class="v">${esc(t.purpose)}</span><span class="k">IBAN</span><span class="v">${t.iban}</span></div>`;
function assignSheet(){
 const t=DB.tx.find(x=>x.id===S.assignTx);
 const plans=DB.plans.filter(p=>p.status==='active'&&summary(p).rest>0);
 let body=txCard(t)+`<div class="sg"><button class="${S.assignMode==='fee'?'on':''}" data-a="amode" data-v="fee">Beitrag</button><button class="${S.assignMode==='plan'?'on':''}" data-a="amode" data-v="plan">Ratenzahlung</button></div>`;
 if(S.assignMode==='fee'){
  body+=`<div class="hint">Wie bisher: offene Beiträge durchsuchen und auswählen.</div><div class="card">${['Jonas Keller · Betreuung Okt 2026 · 312,00 €','Emma Wolf · Betreuung Okt 2026 · 312,00 €','Frieda Neumann · Essen Okt 2026 · 74,00 €'].map((l,i)=>`<button class="row" data-a="asel" data-v="fee${i}"><span class="rad${S.assignSel==='fee'+i?' on':''}">${S.assignSel==='fee'+i?ic('check',14):''}</span><span class="rm"><span class="rt">${l}</span></span></button>`).join('')}</div>`;
 }else{
  const sug=t.guess?.type==='plan'?t.guess.plan:null;
  body+=`${sug?`<div class="note ok">${ic('link',18)}<span>Vorschlag über IBAN: ${esc(plan(sug).name)}</span></div>`:''}
  <div class="card">${plans.map(p=>{const s=summary(p),r=s.sch.find(x=>x.st!=='paid');return `<button class="row" data-a="asel" data-v="${p.id}"><span class="rad${S.assignSel===p.id?' on':''}">${S.assignSel===p.id?ic('check',14):''}</span><span class="rm"><span class="rt">${esc(p.name)}</span><span class="rs">${r?`Rate ${r.nr}/${s.n} · fällig ${fds(r.due)}`:''} · Rest ${eur(s.rest)}</span></span></button>`}).join('')}
  <button class="row" data-a="asel" data-v="new"><span class="rad${S.assignSel==='new'?' on':''}">${S.assignSel==='new'?ic('check',14):''}</span><span class="rm"><span class="rt" style="color:var(--ac-text)">Neue Ratenzahlung anlegen</span><span class="rs">Mit Daten aus dieser Überweisung vorbefüllt</span></span>${ic('plus',18)}</button></div>
  ${S.assignSel&&S.assignSel!=='new'?(()=>{const p=plan(S.assignSel),s=summary(p);const r0=s.sch.find(x=>x.st!=='paid'),over=t.amount-((r0?.amt||0)-(r0?.cov||0));if(t.amount>=s.rest)return `<div class="note ok">${ic('check',18)}<span>Tilgt die Restschuld von ${eur(s.rest)} vollständig – die Ratenzahlung ist danach abgeschlossen.</span></div>`;return `<div class="note plain">${ic('info',18)}<span>Wird der ältesten offenen Rate angerechnet.${over>0?` Überschuss ${eur(over)} läuft in die nächste Rate.`:over<0?` Rate bleibt mit ${eur(-over)} offen.`:''}</span></div>`})():''}`;
 }
 const lbl=S.assignSel==='new'?'Weiter':'Zuordnen';
 return sheetWrap('Transaktion zuordnen',body,`<button class="btn sec" data-a="close">Abbrechen</button><button class="btn pri" data-a="doassign" ${S.assignSel?'':'disabled'}>${lbl}</button>`);
}
function formSheet(){
 const f=S.form, isNew=!f.id;
 const n=f.total>0&&f.rate>0?Math.ceil(f.total/f.rate-1e-9):0;
 const last=n?Math.round((f.total-f.rate*(n-1))*100)/100:0;
 const preview=n&&f.first?`${n} ${n===1?'Rate':'Raten'}${last!==f.rate?` (${n-1} × ${eur(f.rate)} + 1 × ${eur(last)})`:` à ${eur(f.rate)}`} · ${intL(+f.interval)} · letzte Rate ${fd(addM(f.first,(n-1)*f.interval))}`:'Gesamtbetrag, Ratenhöhe und erste Fälligkeit eingeben';
 const hhList=HOUSEHOLDS.filter(h=>!f.hq||h.name.toLowerCase().includes(f.hq.toLowerCase())).slice(0,5);
 const debtor=f.kind==='hh'
  ?`<div class="field"><label>Haushalt *</label><div class="inp">${ic('search',18)}<input data-f="hq" value="${esc(f.hq||'')}" placeholder="Familie oder Kind suchen"></div></div>
    <div class="card" id="hhl">${hhRows(hhList)}</div>`
  :`<div class="field"><label>Name *</label><input data-f="name" value="${esc(f.name)}" placeholder="z. B. Max Mustermann"></div>
    <div class="field"><label>Anschrift <span class="mut">(optional, für Briefe)</span></label><textarea data-f="address" placeholder="Straße, PLZ Ort">${esc(f.address)}</textarea></div>`;
 const body=`${f.fromTx?`<div class="note info">${ic('link',18)}<span>Die Überweisung vom ${fd(f.fromTx.date)} über ${eur(f.fromTx.amount)} wird als erste Zahlung zugeordnet.</span></div>`:''}
 <div class="field"><label>Schuldner</label><div class="sg"><button class="${f.kind==='hh'?'on':''}" data-a="fkind" data-v="hh">Haushalt</button><button class="${f.kind==='ext'?'on':''}" data-a="fkind" data-v="ext">Andere Person</button></div></div>
 ${debtor}
 <div class="field"><label>E-Mail-Adressen <span class="mut">(optional)</span></label>
  <div class="tags">${f.emails.map((e,i)=>`<span class="tag">${esc(e)}<button data-a="rmmail" data-v="${i}" aria-label="Entfernen">${ic('x',14)}</button></span>`).join('')}</div>
  <div class="addrow"><input id="newmail" type="email" placeholder="name@beispiel.de" inputmode="email"><button class="btn sec" data-a="addmail">${ic('plus',16)}Hinzufügen</button></div>
  <div class="hint">${f.kind==='hh'?'Vorbelegt mit den Adressen des Haushalts. ':''}Ohne Adresse erscheint der Fall in den Erinnerungen, kann aber nicht per E-Mail gemahnt werden.</div></div>
 <div class="f2"><div class="field"><label>Gesamtbetrag *</label><input data-f="total" inputmode="decimal" value="${f.total||''}" placeholder="0,00 €"></div><div class="field"><label>Ratenhöhe *</label><input data-f="rate" inputmode="decimal" value="${f.rate||''}" placeholder="0,00 €"></div></div>
 <div class="f2"><div class="field"><label>Intervall</label><select data-f="interval">${INTERVALS.map(([v,l])=>`<option value="${v}"${+f.interval===v?' selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Erste Rate fällig *</label><input type="date" data-f="first" value="${f.first}"></div></div>
 <div class="note plain" id="fprev">${ic('cal',18)}<span>${preview}</span></div>
 <div class="field"><label>Bezug / Aktenzeichen <span class="mut">(optional)</span></label><input data-f="ref" value="${esc(f.ref)}" placeholder="z. B. Rückstand Beiträge 2025"><div class="hint">Steht in Erinnerungen und hilft beim automatischen Abgleich.</div></div>
 <div class="field"><label>IBAN des Zahlers <span class="mut">(optional)</span></label><input data-f="iban" value="${esc(f.iban)}" placeholder="DE…"><div class="hint">Künftige Überweisungen von dieser IBAN werden als Rate vorgeschlagen.</div></div>
 <div class="field"><label>Unterschriebener Vertrag <span class="mut">(PDF)</span></label>${f.contract?`<div class="card">${contractCard(f.contract,'form')}</div>`:contractCard(null,'form')}<div class="hint">Kann auch später auf der Detailseite nachgereicht werden.</div></div>
 <div class="field"><label>Notiz</label><textarea data-f="note" placeholder="Vereinbarung, Ansprechpartner …">${esc(f.note)}</textarea></div>`;
 return sheetWrap(isNew?'Neue Ratenzahlung':'Ratenzahlung bearbeiten',body,`<button class="btn sec" data-a="close">Abbrechen</button><button class="btn pri" data-a="saveplan">${f.fromTx?'Anlegen & zuordnen':'Speichern'}</button>`);
}
function hhRows(list){return list.map(h=>`<button class="row" style="min-height:52px" data-a="fhh" data-v="${h.id}"><span class="rad${S.form.household===h.id?' on':''}">${S.form.household===h.id?ic('check',14):''}</span><span class="rm"><span class="rt">${h.name}</span><span class="rs">${h.kids} · ${h.emails.length?h.emails.length+' E-Mail':'keine E-Mail'}</span></span></button>`).join('')||empty('search','Kein Haushalt gefunden')}
function remindSheet(){
 const p=plan(S.remPlan),s=summary(p),stage=nextStage(p),deadline=plusDays(S.today,14);
 const sel=s.overdue.filter(r=>S.remSel.includes(r.nr)), sum=sel.reduce((a,r)=>a+r.amt-r.cov,0)+(S.remFee?5:0);
 const du=p.kind==='hh', greet=du?`Liebe ${p.name}`:`Guten Tag ${p.name}`;
 const mail=`${greet},\n\n${stage==='Mahnung'?'trotz unserer Erinnerung haben wir':'wir haben'} für die vereinbarte Ratenzahlung${p.ref?` (${p.ref})`:''} folgende ${sel.length===1?'Rate':'Raten'} noch nicht erhalten:\n${sel.map(r=>`• Rate ${r.nr}, fällig ${fd(r.due)}: ${eur(r.amt-r.cov)}`).join('\n')||'—'}${S.remFee?`\n• Mahngebühr: ${eur(5)}`:''}\n\nBitte ${du?'überweise':'überweisen Sie'} ${eur(sum)} bis zum ${fd(deadline)}.\nRestschuld insgesamt: ${eur(s.rest)}.\n\nViele Grüße\nKita Knirpsenstadt`;
 const body=`<div class="card dl">${dl([['Schuldner',esc(p.name)],['Empfänger',p.emails.length?p.emails.map(esc).join('<br>'):'<span style="color:var(--bad)">keine E-Mail-Adresse</span>'],['Frist',fd(deadline)]])}</div>
 ${p.emails.length?'':`<div class="note bad">${ic('alert',18)}<span>Ohne E-Mail-Adresse kein Versand. Adresse ergänzen oder als PDF-Brief drucken.</span><button class="btn sm sec" data-a="editplan">Ergänzen</button></div>`}
 ${sec('Überfällige Raten')}<div class="card" style="margin-top:-8px">${s.overdue.map(r=>`<button class="row" style="min-height:52px" data-a="rsel" data-v="${r.nr}"><span class="cb${S.remSel.includes(r.nr)?' on':''}">${S.remSel.includes(r.nr)?ic('check',14):''}</span><span class="rm"><span class="rt">Rate ${r.nr} · ${eur(r.amt-r.cov)}</span><span class="rs">fällig ${fd(r.due)}</span></span></button>`).join('')}
 ${stage==='Mahnung'?`<button class="row" style="min-height:52px" data-a="rfee"><span class="cb${S.remFee?' on':''}">${S.remFee?ic('check',14):''}</span><span class="rm"><span class="rt">Mahngebühr erheben · ${eur(5)}</span><span class="rs">Laut Regeln fällig (erinnert, Frist abgelaufen)</span></span></button>`:''}</div>
 ${sec(stage==='Mahnung'?'Mahnung':'Zahlungserinnerung')}<div class="mailprev" style="margin-top:-8px">${esc(mail)}</div>`;
 const can=p.emails.length&&sel.length;
 return sheetWrap(`${stage} · ${esc(p.name)}`,body,`<button class="btn sec" data-a="toast" data-v="PDF-Brief erzeugt">PDF</button><button class="btn pri" data-a="dosend" ${can?'':'disabled'}>${ic('send',16)}Senden</button>`);
}
function paySheet(){
 return sheetWrap('Zahlung erfassen',`<div class="hint">Für Bar- oder sonstige Zahlungen ohne Banktransaktion. Überweisungen kommen über den Bankabgleich.</div>
 <div class="f2"><div class="field"><label>Betrag *</label><input id="payamt" inputmode="decimal" value="${plan(S.payPlan).rate}"></div><div class="field"><label>Datum *</label><input id="paydate" type="date" value="${S.today}"></div></div>
 <div class="field"><label>Notiz</label><input id="paytext" value="Barzahlung im Büro"></div>`,`<button class="btn sec" data-a="close">Abbrechen</button><button class="btn pri" data-a="dopay">Speichern</button>`);
}
function sheetHtml(){
 switch(S.sheet){
  case 'assign':return assignSheet();
  case 'form':return formSheet();
  case 'remind':return remindSheet();
  case 'pay':return paySheet();
  case 'final':{const p=plan(S.plan),d=S.finalDate,sch=withFinal(p,d),fin=sch[sch.length-1],before=sch.filter(r=>!r.final),sm=summary(p);
   const fs=schedule({...p,final:d}),finSch=fs[fs.length-1],openBefore=fs.filter(r=>!r.final&&r.st!=='paid');
   return sheetWrap('Schlussrate vereinbaren',`<div class="hint">Die gesamte Restschuld wird an einem Tag fällig – auch bereits überfällige Raten. Alle weiteren Raten entfallen.</div>
   <div class="field"><label>Schlussrate fällig am *</label><input type="date" id="finaldate" value="${d}"></div>
   <div class="card dl">${dl([['Restschuld heute',eur(sm.rest)],['Schlussrate',`<b>${eur(finSch.amt-finSch.cov)}</b>`],['Ersetzt',`${sm.sch.filter(r=>r.st!=='paid').length} offene Raten`]])}</div>
   <div class="hint">Wird die Schlussrate nicht bis zum Datum bezahlt, erscheint sie in den Erinnerungen.</div>
   <div class="note plain">${ic('mail',18)}<span>Optional: Bestätigung mit Betrag, Datum und Bankverbindung an ${p.emails.length?esc(p.emails.join(', ')):'— (keine E-Mail)'} senden.</span></div>`,
   `<button class="btn sec" data-a="close">Abbrechen</button><button class="btn pri" data-a="dofinal">Festlegen</button>`)}
  case 'close':return sheetWrap('Ratenzahlung beenden?',`<p style="margin:0">Die Ratenzahlung wird geschlossen und taucht nicht mehr in den Erinnerungen auf. Restschuld ${eur(summary(plan(S.plan)).rest)} wird als ausgebucht vermerkt.</p><div class="field"><label>Grund</label><select><option>Restschuld erlassen</option><option>An Inkasso/Gericht übergeben</option><option>Irrtümlich angelegt</option></select></div>`,`<button class="btn sec" data-a="close">Abbrechen</button><button class="btn pri" style="background:var(--bad)" data-a="doclose">Beenden</button>`);
  case 'menu':return sheetWrap('Menü',`<nav class="mnav">${NAV.map(g=>`<div class="ng">${g.label?`<h4>${g.label}</h4>`:''}${g.items.map(([id,l,i])=>`<button class="ni${id===curNav()?' on':''}" data-a="go" data-v="${id}">${ic(i,18)}<span>${l}</span></button>`).join('')}</div>`).join('')}</nav>`);
 }
 return '';
}

// ── Render & Events ──
let lastKey='';
function render(){
 const m=$app.querySelector('.main'),st=m?m.scrollTop:0,key=S.page+S.plan;
 const sb=$app.querySelector('.sh-body'),sst=sb?sb.scrollTop:0;
 $app.dataset.theme=S.theme;$app.classList.toggle('wide',S.wide);
 $app.innerHTML=sidebar()+`<div class="col">${topbar()}<main class="main"><div class="inner">${page()}</div></main>${tabs()}</div>`+sheetHtml();
 if(key===lastKey)$app.querySelector('.main').scrollTop=st;
 const nb=$app.querySelector('.sh-body');if(nb&&sb)nb.scrollTop=sst;
 lastKey=key;
 document.querySelectorAll('#ctl button').forEach(b=>{const c=b.dataset.c,v=b.dataset.v;b.classList.toggle('on',c==='theme'?S.theme===v:c==='today'?S.today===v:c==='wide'?String(+S.wide)===v:false)});
}
function toast(msg){$app.querySelectorAll('.toast').forEach(t=>t.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=ic('check',16)+esc(msg);$app.appendChild(d);setTimeout(()=>d.remove(),2600)}
const blankForm=()=>({id:null,kind:'hh',household:null,hq:'',name:'',address:'',emails:[],total:'',rate:'',interval:1,first:addM(S.today,1).slice(0,8)+'01',ref:'',iban:'',note:'',fromTx:null});
const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;
function savePlan(){
 const f=S.form;
 const name=f.kind==='hh'?hh(f.household)?.name:f.name.trim();
 if(!name){toast(f.kind==='hh'?'Bitte Haushalt auswählen':'Bitte Namen eingeben');return false}
 if(!(num(f.total)>0&&num(f.rate)>0&&f.first)){toast('Betrag, Rate und Fälligkeit fehlen');return false}
 const data={kind:f.kind,household:f.kind==='hh'?f.household:null,name,address:f.address,emails:[...f.emails],contract:f.contract||null,total:num(f.total),rate:num(f.rate),interval:+f.interval,first:f.first,ref:f.ref,iban:f.iban,note:f.note};
 if(f.id){Object.assign(plan(f.id),data);return f.id}
 const id='p'+Date.now();DB.plans.unshift({id,...data,payments:[],reminders:[],created:S.today,status:'active'});
 if(f.fromTx){const t=DB.tx.find(x=>x.id===f.fromTx.id);t.done=true;plan(id).payments.push({date:t.date,amount:t.amount,src:'bank',text:t.purpose})}
 return id;
}
$app.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
 if(t.tagName==='A')e.preventDefault();
 const a=t.dataset.a,v=t.dataset.v;
 switch(a){
  case 'go':S.sheet=null;S.page=v;S.plan=null;break;
  case 'plan':S.sheet=null;S.page='plan';S.plan=v;break;
  case 'sheet':S.sheet=v;if(v==='final')S.finalDate=plusDays(S.today,14);break;
  case 'close':S.sheet=null;break;
  case 'pf':S.planFilter=v;break;
  case 'rf':S.remFilter=v;break;
  case 'toast':S.sheet=null;render();toast(v);return;
  case 'assign':{const tx=DB.tx.find(x=>x.id===v);S.assignTx=v;S.assignMode=tx.guess?.type==='fee'?'fee':'plan';S.assignSel=tx.guess?.type==='plan'?tx.guess.plan:tx.guess?.type==='fee'?'fee0':null;S.sheet='assign';break}
  case 'amode':S.assignMode=v;S.assignSel=null;break;
  case 'asel':S.assignSel=v;break;
  case 'doassign':{
   const tx=DB.tx.find(x=>x.id===S.assignTx);
   if(S.assignSel==='new'){
    const nm=tx.payer.includes(',')?tx.payer.split(',').map(s=>s.trim()).reverse().join(' '):tx.payer;
    const ref=(tx.purpose.match(/\d+\s*[A-Z]+\s*\d+\/\d+/)||[''])[0];
    S.form={...blankForm(),kind:'ext',name:nm,rate:tx.amount,first:tx.date,ref:ref?`Az. ${ref}`:tx.purpose,iban:tx.iban,fromTx:{id:tx.id,date:tx.date,amount:tx.amount}};
    S.sheet='form';break;
   }
   tx.done=true;
   if(S.assignMode==='plan'){plan(S.assignSel).payments.push({date:tx.date,amount:tx.amount,src:'bank',text:tx.purpose});S.sheet=null;render();toast(`Als Rate zugeordnet: ${plan(S.assignSel).name}`);return}
   S.sheet=null;render();toast('Beitrag zugeordnet');return;
  }
  case 'newplan':S.form=blankForm();S.sheet='form';break;
  case 'editplan':{const p=plan(S.remPlan&&S.sheet==='remind'?S.remPlan:S.plan);S.form={...p,emails:[...p.emails],contract:p.contract,hq:'',fromTx:null};S.sheet='form';break}
  case 'fkind':S.form.kind=v;if(v==='ext'){S.form.household=null}break;
  case 'fhh':{S.form.household=v;const h=hh(v);S.form.emails=[...new Set([...h.emails])];break}
  case 'addmail':{const i=$app.querySelector('#newmail'),val=i.value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)){toast('Keine gültige E-Mail-Adresse');return}if(!S.form.emails.includes(val))S.form.emails.push(val);break}
  case 'rmmail':S.form.emails.splice(+v,1);break;
  case 'saveplan':{const wasNew=!S.form.id,from=S.form.fromTx,back=S.remPlan&&S.page!=='plan';const id=savePlan();if(!id)return;
   if(S.remPlan&&plan(S.remPlan)&&S.form.id===S.remPlan&&back){S.sheet='remind';render();toast('Gespeichert');return}
   S.sheet=null;S.page='plan';S.plan=id;render();toast(from?'Angelegt und Zahlung zugeordnet':wasNew?'Ratenzahlung angelegt':'Gespeichert');return}
  case 'remind':{const p=plan(v);S.remPlan=v;S.remSel=summary(p).overdue.map(r=>r.nr);S.remFee=false;S.sheet='remind';break}
  case 'rsel':{const n=+v;S.remSel=S.remSel.includes(n)?S.remSel.filter(x=>x!==n):[...S.remSel,n];break}
  case 'rfee':S.remFee=!S.remFee;break;
  case 'dosend':{const p=plan(S.remPlan),stage=nextStage(p);p.reminders.push({date:S.today,stage,to:p.emails.join(', '),deadline:plusDays(S.today,14),fee:S.remFee?5:0});
   if(S.remFee)p.total+=5;
   DB.sent.unshift([p.name,stage+' (Rate)',fd(S.today)]);S.sheet=null;S.remPlan=null;render();toast(`${stage} gesendet`);return}
  case 'addpay':S.payPlan=v;S.sheet='pay';break;
  case 'dopay':{const p=plan(S.payPlan);p.payments.push({date:$app.querySelector('#paydate').value,amount:num($app.querySelector('#payamt').value),src:'bar',text:$app.querySelector('#paytext').value});p.payments.sort((x,y)=>x.date<y.date?-1:1);S.sheet=null;render();toast('Zahlung erfasst');return}
  case 'viewpdf':{const c=v==='form'?S.form.contract:plan(S.plan).contract;if(c.url){window.open(c.url,'_blank');return}S.sheet=v==='form'?S.sheet:null;render();toast('Öffnet das PDF (im Mock nur Beispieldatei)');return}
  case 'rmpdf':if(v==='form')S.form.contract=null;else{plan(S.plan).contract=null;render();toast('Vertrag entfernt');return}break;
  case 'dofinal':plan(S.plan).final=S.finalDate;S.sheet=null;render();toast('Schlussrate festgelegt');return;
  case 'unfinal':plan(S.plan).final=null;render();toast('Ursprünglicher Ratenplan wiederhergestellt');return;
  case 'doclose':plan(S.plan).status='closed';S.sheet=null;render();toast('Ratenzahlung beendet');return;
 }
 render();
});
$app.addEventListener('input',e=>{
 const k=e.target.dataset.f;if(!k||!S.form)return;S.form[k]=e.target.value;
 if(k==='hq'){const l=HOUSEHOLDS.filter(h=>h.name.toLowerCase().includes(e.target.value.toLowerCase())).slice(0,5);$app.querySelector('#hhl').innerHTML=hhRows(l);return}
 if(['total','rate','interval','first'].includes(k)){
  const f={...S.form,total:num(S.form.total),rate:num(S.form.rate),interval:+S.form.interval};
  const n=f.total>0&&f.rate>0?Math.ceil(f.total/f.rate-1e-9):0,last=n?Math.round((f.total-f.rate*(n-1))*100)/100:0;
  $app.querySelector('#fprev span').textContent=n&&f.first?`${n} ${n===1?'Rate':'Raten'}${last!==f.rate?` (${n-1} × ${eur(f.rate)} + 1 × ${eur(last)})`:` à ${eur(f.rate)}`} · ${intL(f.interval)} · letzte Rate ${fd(addM(f.first,(n-1)*f.interval))}`:'Gesamtbetrag, Ratenhöhe und erste Fälligkeit eingeben';
 }
});
$app.addEventListener('change',e=>{const up=e.target.dataset.up;if(up){const file=e.target.files[0];if(!file)return;
  if(file.type&&file.type!=='application/pdf'){toast('Bitte eine PDF-Datei wählen');return}
  const c={name:file.name,size:file.size,uploaded:S.today,by:'Stefan',url:URL.createObjectURL(file)};
  if(up==='form'){S.form.contract=c;render()}else{plan(S.plan).contract=c;render();toast('Vertrag hochgeladen')}return}if(e.target.id==='finaldate'&&e.target.value){S.finalDate=e.target.value;render();return}if(e.target.dataset.f==='interval'){S.form.interval=+e.target.value;e.target.dispatchEvent(new Event('input',{bubbles:true}))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}if(e.key==='Enter'&&e.target.id==='newmail'){e.preventDefault();$app.querySelector('[data-a=addmail]').click()}});
document.getElementById('ctl').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const c=b.dataset.c,v=b.dataset.v;
 if(c==='theme')S.theme=v;
 if(c==='today')S.today=v;
 if(c==='wide')S.wide=v==='1';
 if(c==='reset'){DB=seed();Object.assign(S,{page:'tasks',plan:null,sheet:null,today:'2026-10-31'})}
 render();
});
for(const part of location.hash.slice(1).split('&').filter(Boolean)){const[k,v]=part.split('=');if(k==='wide')S.wide=true;else if(k==='dark'||k==='light')S.theme=k;else if(k==='page')S.page=v;}
if(!location.hash)S.page='tasks';
render();
</script>
</body></html>
