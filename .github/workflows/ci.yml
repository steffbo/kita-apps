name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  backend-fees:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fees
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-fees/go.mod
          cache-dependency-path: backend-fees/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Integration tests start PostgreSQL via testcontainers (Docker is available on the runner).
      - name: go test
        run: go test ./...

  beitraege:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter @kita/beitraege typecheck

  # Playwright suite against a production-like stack (disposable PostgreSQL,
  # frontend embedded into backend-fees); see frontend/playwright.config.ts.
  e2e-beitraege:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-fees/go.mod
          cache-dependency-path: backend-fees/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Playwright
        run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
