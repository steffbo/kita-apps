name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  backend-fees:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fees
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-fees/go.mod
          cache-dependency-path: backend-fees/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Integration tests start PostgreSQL via testcontainers (Docker is available on the runner).
      - name: go test
        run: go test ./...

  beitraege:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter @kita/beitraege typecheck
